[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replayer"
version = "0.1.0"
description = "A CLI tool to replay career events and generate a resume."
authors = [
    { name="Rohith Pavithran", email="rohithtp@gmail.com" }
]

[project.scripts]
replay = "replayer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
